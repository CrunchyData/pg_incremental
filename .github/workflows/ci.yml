name: CI

on:
  push:
    branches: [main, 'release-*']
  pull_request:

jobs:
  installcheck:
    name: installcheck (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]
    steps:
      - uses: actions/checkout@v4

      - name: Build and run regression tests
        run: PG_VERSIONS="${{ matrix.pg }}" ./docker/run-tests.sh
